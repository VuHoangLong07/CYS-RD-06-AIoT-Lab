name: mqtt-software-lab

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  node-red:
    image: nodered/node-red:5.0.7
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:${NODE_RED_PORT:-1880}:1880"
    volumes:
      - node_red_data:/data

volumes:
  mosquitto_data:
  node_red_data:
